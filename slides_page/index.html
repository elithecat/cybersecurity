<!doctype html>
<title>Cybersecurity 2026 Slides</title>
<style>
:root { --bg:#f3f4f6; --ink:#1b2430; --muted:#5d6878; --line:#d9dee6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12161c; --ink:#e7eaf0; --muted:#9aa5b4; --line:#2a323e; } }
:root[data-theme="dark"] { --bg:#12161c; --ink:#e7eaf0; --muted:#9aa5b4; --line:#2a323e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:960px; margin:0 auto; padding:20px 16px 48px; display:grid; gap:18px; }
h1 { font-size:1.3rem; margin:0; }
p { margin:0; color:var(--muted); font-size:.9rem; }
figure { margin:0; display:grid; gap:4px; }
img { width:100%; height:auto; display:block; background:#fff; border:1px solid var(--line); border-radius:6px; }
figcaption { font-size:.75rem; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
</style>
